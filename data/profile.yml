# data/profile.yml — единственный источник контента визитки.
#
# Назначение: имя, описание, ссылки, навыки, опыт и проекты живут здесь, а не в коде.
# `prisma/seed/main.ts` только читает этот файл, валидирует его по JSON-схеме
# (`config/profile-data.schema.yml`), проверяет согласованность периодов
# (`prisma/seed/data/experience-periods.check.ts`) и раскладывает данные в БД: перед вставкой
# доменные таблицы очищаются, поэтому содержимое базы после запуска равно содержимому этого файла.
# Схема повторяет модель Prisma (`prisma/schema.prisma`) без служебных полей:
# `id`, `profileId`, `createdAt`, `updatedAt`.
#
# Правило порядка: порядок элементов в массивах = порядок вывода в API. Служебной колонки порядка
# в БД нет и индекс элемента сидинг не проставляет: порядок выводится из значений строки. Опыт
# перечислен от свежего места к раннему, навыки — сгруппированы по `category`.
#
# Персональные контакты — телефон и email — в публичный репозиторий не публикуются: из контактов
# здесь только ссылки (профили и мессенджеры) и открытые страницы проектов.
#
# Формат полей:
#   - `version` — версия формата; несовпадение при загрузке = явная ошибка, а не молчаливый парс;
#   - `startedAt` / `endedAt` — календарные даты `YYYY-MM-DD` без времени и часового пояса;
#   - `finished` / `endedAt` — пара, описывающая состояние места работы:
#       завершённое место: `finished: true` и дата окончания `endedAt`;
#       текущее место: флага нет (или `finished: false`), `endedAt` отсутствует или `null`.
#     Согласованность пары проверяет сидинг при записи, в `prisma/seed/data/experience-periods.check.ts`;
#     чтение из БД ничего не валидирует и отдаёт строку в API как есть;
#   - параллельные места работы разрешены: несколько записей могут пересекаться по датам,
#     пересечение периодов ошибкой не считается;
#   - `isCurrent` не пишется: такого поля в API нет, состояние места работы клиент выводит
#     из `finished` и `endedAt`;
#   - URL (`links[].url`, `projects[].url`) — только абсолютный `http(s)`;
#   - `kind` у ссылки — только GITHUB | LINKEDIN | WEBSITE | OTHER (enum SocialKind);
#   - `skills[].category` — свободная строка-группировка («language», «backend», «database», …);
#   - `projects[].url` и `projects[].description` необязательны (могут быть null).

