# it-smi-global: общий план реализации (roadmap)
task: it-smi-global
version: 1
note: |
  Сквозной план по tz-detail.md. Это roadmap, а не todo одной задачи: каждая группа — кандидат
  в отдельную задачу .opencode/tasks/<task-id>/, которую создаёт planner (профиль full или normal).
  Порядок групп — обязательная последовательность. Инфраструктура (д) идёт ДО данных (б): миграции
  и сидинг требуют живой PostgreSQL, поэтому Docker и БД поднимаются первыми.
  Тесты и проверки (е) заблокированы до готовности инфраструктуры и шаблонов.
groups:
  - id: и
    title: "Исходные данные визитки"
    status: in-progress
    note: |
      Группа стоит первой, потому что это вход для сидинга (б3) и самый дешёвый шаг.
      Буква `и` — следующий свободный id; порядок вывода задаётся порядком в этом списке,
      а не алфавитом, поэтому существующие id (а…з) не переименовываются.
  - id: а
    title: "Фундамент и каркас"
    status: done
  - id: д
    title: "Инфраструктура — Docker и PostgreSQL"
    status: done
    note: |
      Идёт до группы б: prisma migrate deploy и seed требуют живой PostgreSQL.
      Сюда же входит первый шаблон запуска с нуля (Dockerfile, compose, entrypoint).
  - id: б
    title: "Данные — Prisma и PostgreSQL"
    status: done
  - id: в
    title: "GraphQL-слой"
    status: done
  - id: г
    title: "Вложенные запросы без N+1"
    status: done
  - id: е
    title: "Тесты и качество кода"
    status: in-progress
    note: |
      Разблокирована: инфраструктура (д) и шаблоны готовы, покрыт пакет yaml-loader (20 тестов,
      задача config-root-resolver). Работа ведётся в задаче tests-and-quality.
  - id: ж
    title: "Документация"
    status: deferred
    note: |
      Отложена: README написан преждевременно, до рефакторинга и оптимизации.
      Переписывается после того, как код стабилизируется.
  - id: з
    title: "Деплой и сдача"
    status: todo
