# config/seed.config.yml — дополнение к JSON Schema.
#
# Структуру данных (свойства, вложенность, обязательность, даты, маркеры) описывает
# config/profile-data.schema.yml. Здесь только то, чего в схеме нет физически:
# путь к файлу данных, колонка связи с родителем и натуральные ключи идемпотентной записи.
#
# Служебных колонок для порядка больше нет: порядок вывода коллекции задаётся её значениями
# (наименование, дата), поэтому сидинг не проставляет индекс элемента массива и ничего о нём
# не знает.
#
# Пути переопределяются переменными окружения:
#   - SEED_CONFIG — этот файл;
#   - SEED_SCHEMA — JSON Schema;
#   - PROFILE_DATA_FILE — файл данных вместо `data`.
#
# Ключи в `models` — имена `$defs` из схемы в PascalCase: `socialLink` → `SocialLink`.
# Если имя расходится с моделью Prisma, его задаёт `model: <имя модели>`.
#
# Стратегия записи выводится из наличия `key`:
#   - `key` есть → upsert по натуральному ключу и удаление строк, которых нет в файле;
#   - `key` нет → удаление строк родителя и вставка заново в той же транзакции.
# Корневая модель — единственный объект файла, поэтому у неё нет родителя: без `key` заменяются
# все её строки, и повторный запуск не добавляет второй корень.
#
# Файл лежит в `config/` в корне проекта и читается относительно рабочего каталога (сидинг
# запускается как `node dist/prisma/seed/main.js` из корня проекта и из `/app` в контейнере).

# Файл данных. Схема — config/profile-data.schema.yml (переопределяется SEED_SCHEMA).
data: data/profile.yml

# Только то, чего нет в JSON Schema: колонка связи с родителем и натуральные ключи.
models:
  Profile:
    key: [slug]
  SocialLink:
    foreignKey: profileId
  Skill:
    foreignKey: profileId
    key: [profileId, name]
  Experience:
    foreignKey: profileId
  Project:
    foreignKey: profileId
